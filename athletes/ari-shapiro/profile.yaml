  focus: 'Seven weeks to Shawangunk Grit (50 mi, 4,000 ft). Rebuild after Gravel Nats (Sep 12, 4h29, 313 TSS) with
    two short build blocks, climbing repeats and one dress rehearsal, then taper. He is a junior: two hard days
    a week max, sleep is the third.'
  coach_notes: 'Junior (14 per Nov 2025 review; birth year not recorded -- age set to 15, VERIFY). Weight ~133 lb
    / 60 kg (Jul 2026). FTP 220 W (TP threshold, verified 2026-08-21; mFTP 215). Gravel Nats Sep 12 done; calendar
    Sep 15-20 is endurance only. Sunday is his requested off day (Nov 2025, Mar 2026); Saturday long. School weekdays
    -- sessions after 3:30pm, 60-90 min. Fall MTB/track status for 2026 unconfirmed (Aug 12 he asked about track
    and field; coach said do both) -- weekday MTB/XC practice may land on Tue/Thu, so keep Tue/Thu prescriptions
    short and let his own sport days count. Illness Aug 24-30 and still sniffling Sep 6 -- ramp gently in W1. Strength/plyo
    (Spenst, 6-min abs) are his own cards, not prescribed here. Workouts must be %FTP (Matti ruling 2026-09-17).
    Coach rules on file: no sandbagging, use power+HR to triangulate, back off and sleep when tired.'
