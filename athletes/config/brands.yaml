# Shared brand registry for the production plan pipeline.
#
# This file is copied into the Railway image with athletes/, so webhook and
# generator consumers resolve the same values in production and in the repo.
default_brand: gravelgod

brands:
  gravelgod:
    discipline: gravel
    allowed_disciplines: [gravel, mtb]
    name: Gravel God Cycling
    coaching_name: Gravel God Coaching
    coaching_email: gravelgodcoaching@gmail.com
    site: https://gravelgodcycling.com
    questionnaire_path: /training-plans/questionnaire/
    consulting_path: /consulting/
    consulting_success_path: /consulting/confirmed/
    subject_prefix: "[GG]"
    workout_author: Gravel God Training
    system_name: Gravel God Training System
    guide:
      logo: GRAVEL GOD
      tagline: Custom training plans for gravel racing
      taglines:
        gravel: Custom training plans for gravel racing
        mtb: Custom training plans for off-road racing
      skills_titles:
        gravel: Gravel Skills
        mtb: Mountain Bike Skills
    paths:
      guides_repo: ../guides/gravel-god-guides
      guides_repo_env: GG_GUIDES_DIR
      brand_repo: ../gravel-god-brand
      guides_repo_name: gravel-god-guides
      github_pages_base: https://wattgod.github.io
    email:
      from_email: coach@gravelgod.com
      from_name: Gravel God Coaching
      resend_from: Gravel God <noreply@gravelgodcycling.com>
      resend_from_env: RESEND_FROM
      signature_name: Matti
      signature_organization: Gravel God Coaching
      signature_site: gravelgodcycling.com
    analytics:
      measurement_id: G-EJJZ9T6M52
      measurement_id_env: GA4_MEASUREMENT_ID
      api_secret_env: GA4_MP_API_SECRET

  roadielabs:
    discipline: road
    allowed_disciplines: [road]
    name: Roadie Labs
    coaching_name: Roadie Labs
    site: https://roadielabs.com
    questionnaire_path: /questionnaire/
    # RL's /consulting/ 403s and /confirmed/ is a live orphan today — the
    # webhook resolves these paths for any brand, but consulting stays
    # disabled for Roadie until the pages ship (CONSULT-ENGINE slice C5).
    consulting_path: /consulting/
    consulting_success_path: /consulting/confirmed/
    subject_prefix: "[RL]"
    workout_author: Roadie Labs Training
    system_name: Roadie Labs Training System
    guide:
      logo: ROADIE LABS
      tagline: Custom training plans for road racing
      taglines:
        road: Custom training plans for road racing
      skills_titles:
        road: Road Skills
    paths:
      guides_repo: ../guides/roadie-labs-guides
      guides_repo_env: ROADIE_GUIDES_DIR
      brand_repo: ../roadie-labs-brand
      guides_repo_name: roadie-labs-guides
      github_pages_base: https://wattgod.github.io
    email:
      from_email: coach@roadielabs.com
      from_name: Roadie Labs
      resend_from: Roadie Labs <noreply@roadielabs.com>
      resend_from_env: RESEND_FROM_ROADIELABS
      signature_name: Matti
      signature_organization: Roadie Labs
      signature_site: roadielabs.com
    analytics:
      measurement_id: ""
      measurement_id_env: GA4_MEASUREMENT_ID_RL
      api_secret_env: GA4_MP_API_SECRET_RL

  xcskilabs:
    discipline: xc_ski
    allowed_disciplines: [xc_ski]
    name: XC Ski Labs
    coaching_name: XC Ski Labs
    coaching_email: gravelgodcoaching@gmail.com
    site: https://xcskilabs.com
    # No plan questionnaire exists for this brand yet — training-plan
    # generation is not supported (see consulting_only below). Key kept for
    # loader/schema parity with the other brands; unused while
    # consulting_only is set.
    questionnaire_path: /questionnaire/
    consulting_path: /consulting/
    consulting_success_path: /consulting/confirmed/
    subject_prefix: "[XC]"
    workout_author: XC Ski Labs Training
    system_name: XC Ski Labs Training System
    # Sells the $150 consult (+ $100 plan add-on) through the shared GG
    # Stripe account / Railway webhook, but does NOT support training-plan
    # generation — /api/create-checkout and the training-plan webhook both
    # refuse (400) for this brand instead of building a plan.
    consulting_only: true
    guide:
      logo: XC SKI LABS
      tagline: Custom training plans for cross-country ski racing
      taglines:
        xc_ski: Custom training plans for cross-country ski racing
      skills_titles:
        xc_ski: Ski Skills
    paths:
      guides_repo: ../guides/xc-ski-labs-guides
      guides_repo_env: XC_GUIDES_DIR
      brand_repo: ../nordic-labs-brand
      guides_repo_name: xc-ski-labs-guides
      github_pages_base: https://wattgod.github.io
    email:
      from_email: coaching@xcskilabs.com
      from_name: XC Ski Labs
      # Left blank deliberately (not the brand's own noreply@xcskilabs.com):
      # the xcskilabs.com Resend sending domain is not yet verified. When
      # RESEND_FROM_XCSKILABS is unset, load_brands() would otherwise fall
      # back to this literal resend_from value (see brand_config.py); an
      # empty value here falls through to _send_email()'s `or RESEND_FROM`
      # and uses the verified Gravel God sender instead. Set
      # RESEND_FROM_XCSKILABS once the domain is verified.
      resend_from: ""
      resend_from_env: RESEND_FROM_XCSKILABS
      signature_name: Matti
      signature_organization: XC Ski Labs
      signature_site: xcskilabs.com
    analytics:
      measurement_id: ""
      measurement_id_env: GA4_MEASUREMENT_ID_XC
      api_secret_env: GA4_MP_API_SECRET_XC
