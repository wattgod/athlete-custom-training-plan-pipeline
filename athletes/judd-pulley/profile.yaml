  # straight from it, so a slash becomes a path separator and generation dies.
  name: 'TBD — Oct 24 event slot'
  date: '2026-10-24'
  priority: 'B'
  discipline: gravel
  status: unpicked
  # PLACEHOLDER — Judd has not picked the event. 50 mi is the honest default
  # for a first-ever race and is what the race-week sharpener and fueling
  # projections are built against. If he picks something longer or hillier,
  # W05 must be regenerated. Do not treat these two numbers as facts.
  distance_miles: 50
  elevation_gain_ft: 3000

