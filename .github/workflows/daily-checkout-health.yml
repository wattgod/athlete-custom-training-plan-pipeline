name: "Daily Checkout Health Check"

# Runs every morning at 7 AM Mountain (13:00 UTC)
# Verifies public coaching surfaces, the intake edge, durable storage, Stripe
# price/webhook readbacks, analytics configuration, and the existing training
# plan/consulting checkout rails. No charge, email, athlete case, or TP write.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  API_BASE: https://athlete-custom-training-plan-pipeline-production.up.railway.app
  COACHING_CANARY_URL: https://coaching-intake.gravelgodcoaching.workers.dev/__canary
  COACHING_CANARY_SECRET: ${{ secrets.COACHING_CANARY_SECRET }}

jobs:
  checkout-health:
    name: "Verify all checkout flows"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Fail fast if coaching canary secret is missing"
        run: |
          if [ -z "$COACHING_CANARY_SECRET" ]; then
            echo "::error::COACHING_CANARY_SECRET must match the Worker secret"
            exit 1
          fi

      - name: "Health check — Railway service"
        run: |
          RESPONSE=$(curl -sf $API_BASE/health)
          echo "$RESPONSE" | python3 -m json.tool
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Health check failed: status=$STATUS"
            exit 1
          fi

      - name: "Training plan checkout"
        run: |
          RESPONSE=$(curl -sf -X POST \
            $API_BASE/api/create-checkout \
            -H "Content-Type: application/json" \
            -H "Origin: https://gravelgodcycling.com" \
            -d '{
              "email": "healthcheck@gravelgodcycling.com",
              "name": "Daily Health Check [TEST]",
              "races": [{"name": "Health Check Race", "date": "2026-12-31", "priority": "A"}],
              "ftp": 200,
              "weight": "70kg"
            }')

          URL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('checkout_url',''))")
          if [[ "$URL" != https://checkout.stripe.com/* ]]; then
            echo "::error::Training plan checkout failed — no valid Stripe URL"
            echo "$RESPONSE" | python3 -m json.tool
            exit 1
          fi

          PRICE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['price']['price_cents'])")
          if [ "$PRICE" -lt 6000 ] || [ "$PRICE" -gt 25000 ]; then
            echo "::error::Unexpected training plan price: $PRICE cents"
            exit 1
          fi
          echo "Training plan checkout OK ($PRICE cents)"

      - name: "Public coaching pages — all brands"
        run: |
          python3 - <<'PY'
          import urllib.request

          sites = (
              "https://gravelgodcycling.com",
              "https://roadielabs.com",
              "https://xcskilabs.com",
          )
          paths = ("/coaching/", "/coaching/apply/", "/coaching/welcome/")
          for site in sites:
              for path in paths:
                  url = site + path
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 CoachingOnboardingCanary/1.0",
                  })
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(2_000_000).decode("utf-8", "replace")
                      if response.status != 200 or len(body) < 500:
                          raise SystemExit(f"unhealthy coaching page: {url}")
                  if path == "/coaching/apply/":
                      required = ("coaching_intake_submission_id", "coaching-intake")
                      if not all(token in body for token in required):
                          raise SystemExit(f"intake contract missing from {url}")
                  print("OK", url)
          PY

      - name: "Coaching edge-to-provider canary"
        run: |
          HTTP_STATUS=$(curl -sS \
            -o "${RUNNER_TEMP}/coaching-canary.json" \
            -w '%{http_code}' \
            -X POST "$COACHING_CANARY_URL" \
            -H "X-Coaching-Canary-Secret: $COACHING_CANARY_SECRET")
          python3 -m json.tool "${RUNNER_TEMP}/coaching-canary.json"
          STATUS=$(python3 -c "import json,os,pathlib; print(json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'coaching-canary.json').read_text()).get('status',''))")
          if [ "$HTTP_STATUS" != "200" ] || [ "$STATUS" != "ok" ]; then
            echo "::error::Coaching canary failed (HTTP $HTTP_STATUS, status=$STATUS)"
            exit 1
          fi

      - name: "Consulting checkout (1 hour)"
        run: |
          RESPONSE=$(curl -sf -X POST \
            $API_BASE/api/create-consulting-checkout \
            -H "Content-Type: application/json" \
            -H "Origin: https://gravelgodcycling.com" \
            -d '{
              "email": "healthcheck@gravelgodcycling.com",
              "name": "Daily Health Check [TEST]",
              "hours": 1
            }')

          URL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('checkout_url',''))")
          if [[ "$URL" != https://checkout.stripe.com/* ]]; then
            echo "::error::Consulting checkout failed — no valid Stripe URL"
            echo "$RESPONSE" | python3 -m json.tool
            exit 1
          fi
          echo "Consulting checkout OK (1 hour)"

      - name: "Questionnaire-started endpoint"
        run: |
          RESPONSE=$(curl -sf -X POST \
            $API_BASE/api/questionnaire-started \
            -H "Content-Type: application/json" \
            -H "Origin: https://gravelgodcycling.com" \
            -d '{
              "email": "healthcheck@gravelgodcycling.com",
              "name": "Daily Health Check [TEST]",
              "sections_reached": 1,
              "source": "health-check"
            }')

          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
          if [ "$STATUS" != "tracked" ] && [ "$STATUS" != "already_tracked" ]; then
            echo "::error::Questionnaire-started endpoint failed: $STATUS"
            exit 1
          fi
          echo "Questionnaire-started endpoint OK ($STATUS)"

      - name: "Upload coaching canary receipt"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coaching-onboarding-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/coaching-canary.json
          if-no-files-found: error
          retention-days: 30
