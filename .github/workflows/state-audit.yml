name: "Railway Fulfillment State Audit"

# Kept separate from the daily order drill so disabling DRILL_ENABLED cannot
# disable production-state safety monitoring. Railway has no operator crontab;
# this authenticated call audits the persistent state inside the live service.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Production health must ship schema and token keys
        run: |
          HTTP_STATUS=$(curl -sS \
            -o "${RUNNER_TEMP}/health.json" \
            -w '%{http_code}' \
            https://athlete-custom-training-plan-pipeline-production.up.railway.app/health)
          python3 -m json.tool "${RUNNER_TEMP}/health.json"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Production /health returned HTTP $HTTP_STATUS"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, sys
          data = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "health.json").read_text())
          files = data.get("runtime_files") or {}
          missing = []
          if files.get("apply_contract_schema") is not True:
              missing.append("runtime_files.apply_contract_schema")
          tokens = data.get("token_config")
          if isinstance(tokens, dict):
              if tokens.get("review") is not True:
                  missing.append("token_config.review")
              if tokens.get("download") is not True:
                  missing.append("token_config.download")
          if missing:
              print("missing:", ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Trigger authenticated Railway state audit
        env:
          # CRON_SECRET repo secret matches the Railway CRON_SECRET env var
          # (same contract as daily-followup-emails.yml).
          STATE_AUDIT_URL: https://athlete-custom-training-plan-pipeline-production.up.railway.app/api/cron/state-audit
          STATE_AUDIT_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$STATE_AUDIT_CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret must be configured (same value as the Railway CRON_SECRET env var)"
            exit 1
          fi
          HTTP_STATUS=$(curl -sS \
            -o "${RUNNER_TEMP}/state-audit.json" \
            -w '%{http_code}' \
            -X POST "$STATE_AUDIT_URL" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $STATE_AUDIT_CRON_SECRET" \
            --data '{"max_age_days":3}')
          python3 -m json.tool "${RUNNER_TEMP}/state-audit.json"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::State audit returned HTTP $HTTP_STATUS"
            exit 1
          fi
