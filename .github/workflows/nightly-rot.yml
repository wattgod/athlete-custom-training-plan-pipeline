name: "Nightly Calendar-Rot Gate"

# Two date-rot failures hit CI in one week: the engine-season 7-day window and
# golden race-pick drift. This real-clock job exists so the next one is found
# overnight, not while fulfilling a paid order.

on:
  schedule:
    - cron: '0 8 * * *'  # nightly 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chromium (acceptance PDF engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-dateutil pytest pypdf pillow requests beautifulsoup4
          pip install -r webhook/requirements.txt || echo "webhook reqs partial"

      - name: Run full pytest suite on the real clock
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest . -q

      - name: Run ORDER ACCEPTANCE on the real clock
        if: always()
        working-directory: athletes/scripts
        env:
          PYTHONPATH: ${{ github.workspace }}
          GG_RUN_ACCEPTANCE: '1'
        run: |
          python -m pytest test_order_acceptance.py -q

      - name: Check pinned fixture freshness
        if: always()
        run: |
          python scripts/check_fixture_freshness.py
